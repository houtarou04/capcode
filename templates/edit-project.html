<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل مشروع - {{ project.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; }
        * { box-sizing: border-box; }
        body { font-family: 'Cairo', 'Tahoma'; background: var(--bg); padding: 0; margin: 0; }
        .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 20px 30px; }
        .header a { color: white; text-decoration: none; opacity: 0.9; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .card { background: var(--card); padding: 35px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.07); }
        h1 { margin-bottom: 25px; color: var(--primary-dark); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-full { grid-column: 1 / -1; }
        
        .form-group { margin-bottom: 5px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; font-size: 15px; }
        input, textarea { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid var(--border); 
            border-radius: 10px; 
            font-family: 'Cairo';
            font-size: 16px;
            transition: 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        textarea { min-height: 150px; resize: vertical; line-height: 1.7; } /* مريحة للكتابة */
        
        .img-preview { display: flex; gap: 15px; margin-top: 10px; }
        .img-box { border: 2px dashed var(--border); padding: 10px; border-radius: 10px; text-align: center; }
        .img-box small { color: #64748b; }

        .btn { 
            background: var(--primary); 
            color: white; 
            padding: 14px 30px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn:hover { background: var(--primary-dark); transform: translateY(-2px); }

        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <a href="/admin">← العودة للوحة التحكم</a>
    </div>

    <div class="container">
        <div class="card">
            <h1>✏️ تعديل مشروع: {{ project.title }}</h1>
            <form action="/edit-project/{{ project.id }}" method="POST" enctype="multipart/form-data" class="form-grid">
                
                <div class="form-group">
                    <label>عنوان المشروع</label>
                    <input type="text" name="title" value="{{ project.title }}" required>
                </div>

                <div class="form-group">
                    <label>سعر المشروع $</label> <!-- الخانة الجديدة -->
                    <input type="number" name="price" value="{{ project.price or 0 }}" step="0.01" placeholder="500">
                </div>

                <div class="form-group form-full">
                    <label>وصف قصير - يظهر في الكارد</label>
                    <input type="text" name="short_desc" value="{{ project.short_desc }}" required>
                </div>

                <div class="form-group form-full">
                    <label>الوصف الكامل</label>
                    <textarea name="full_desc" required>{{ project.full_desc }}</textarea>
                </div>

                <div class="form-group">
                    <label>المهارات المستخدمة</label>
                    <input type="text" name="skills_used" value="{{ project.skills_used }}" placeholder="افصل بينهم بفاصلة">
                </div>

                <div class="form-group">
                    <label>رابط Github</label>
                    <input type="text" name="github_link" value="{{ project.github_link }}">
                </div>

                <div class="form-group form-full">
                    <label>رابط الموقع لايف</label>
                    <input type="text" name="live_link" value="{{ project.live_link }}">
                </div>

                <div class="form-group">
                    <label>صورة الديسكتوب الجديدة</label>
                    <div class="img-box">
                        <small>الحالية: {{ project.img_desktop or 'مفيش' }}</small>
                        <input type="file" name="img_d" accept="image/*">
                    </div>
                </div>

                <div class="form-group">
                    <label>صورة الموبايل الجديدة</label>
                    <div class="img-box">
                        <small>الحالية: {{ project.img_mobile or 'مفيش' }}</small>
                        <input type="file" name="img_m" accept="image/*">
                    </div>
                </div>

                <div class="form-full">
                    <button type="submit" class="btn">💾 حفظ كل التعديلات</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
